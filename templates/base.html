<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block title %}Renewal Tracker{% endblock %} · Fincart</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard') }}" aria-label="Fincart Renewal Tracker home"><span class="brand-mark" aria-hidden="true">f.</span><span>fincart<span class="brand-product">Insurance operations</span></span></a>
  <nav aria-label="Main navigation">
    <a href="{{ url_for('dashboard') }}" {% if request.endpoint == 'dashboard' %}class="active" aria-current="page"{% endif %}>Renewals</a>
    <a href="{{ url_for('upload') }}" {% if request.endpoint == 'upload' %}class="active" aria-current="page"{% endif %}>Import data</a>
  </nav>
  <span class="workspace-label">Renewal workspace</span>
</header>
<main id="main">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="notice {{ category }}" role="status">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
